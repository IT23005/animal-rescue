<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Volunteer | Animal Rescue</title>
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261008-2">
</head>

<body>

    <nav class="navbar">
        <div class="nav-brand"><a href="/index.html">🐾 Animal Rescue</a></div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/index.html#available-animals">Browse Animals</a>
            <a href="/report.html">Report Stray</a>
            <span id="volunteer-link"></span>
            <span id="dashboard-link"></span>
            <a href="/login.html" id="nav-login">Login</a>
            <span id="nav-user"></span>
            <a href="#" id="nav-logout" style="display:none" onclick="logout()">Logout</a>
        </div>
    </nav>


    <div class="page-header">
        <h1>🤝 Become a Volunteer</h1>
        <p>Join our team and help save animals</p>
    </div>

    <div class="auth-container">
        <div class="auth-card" style="max-width:550px;">
            <h2>Volunteer Application</h2>
            <p class="auth-subtitle">Fill out the form and our admin will review your application</p>

            <div id="message" class="message" style="display:none"></div>

            <form id="volunteer-form">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="text" id="phone" placeholder="Your phone number" required>
                </div>
                <div class="form-group">
                    <label>Address *</label>
                    <input type="text" id="address" placeholder="Your full address" required>
                </div>
                <div class="form-group">
                    <label>Why do you want to volunteer? *</label>
                    <textarea id="reason" rows="4" placeholder="Tell us why you want to help..." required
                        style="resize:vertical;"></textarea>
                </div>
                <div class="form-group">
                    <label>Relevant Experience</label>
                    <textarea id="experience" rows="3" placeholder="Any experience with animals or rescue work?"
                        style="resize:vertical;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    Submit Application
                </button>
            </form>

            <p class="auth-link" style="margin-top:20px;">
                Already a volunteer? <a href="/login.html">Login here</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        <p>🐾 Animal Rescue & Adoption Portal</p>
    </footer>

    <script src="/js/main.js?v=20261008-2"></script>
    <script>
        document.getElementById('volunteer-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                reason: document.getElementById('reason').value,
                experience: document.getElementById('experience').value
            };

            try {
                const res = await fetch('/api/auth/volunteer-apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ Application submitted! We will contact you soon.';
                    msgDiv.style.display = 'block';
                    document.getElementById('volunteer-form').style.display = 'none';
                    window.scrollTo(0, 0);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = '❌ ' + result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Something went wrong.';
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
