<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Animal Rescue</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand"><a href="/index.html">🐾 Animal Rescue</a></div>
    <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/animals.html">Browse Animals</a>
        <a href="/report.html">Report Stray</a>
        <span id="volunteer-link"></span>
        <span id="dashboard-link"></span>
        <a href="/login.html" id="nav-login">Login</a>
        <span id="nav-user"></span>
        <a href="#" id="nav-logout" style="display:none" onclick="logout()">Logout</a>
    </div>
</nav>


    <div class="page-header">
        <h1>👤 My Profile</h1>
        <p>Manage your account information</p>
    </div>

    <div class="dashboard" style="max-width:700px;">

        <!-- PROFILE INFO -->
        <div class="table-container" style="margin-bottom:25px;">
            <h3>📋 Profile Information</h3>
            <div style="padding:25px;">
                <div id="profile-message" class="message" style="display:none"></div>
                <form id="profile-form">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="name" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" disabled
                            style="background:#f5f5f5; cursor:not-allowed;">
                        <small style="color:#777;">Email cannot be changed</small>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="phone" placeholder="Your phone number">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="Your address">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <input type="text" id="role" disabled
                            style="background:#f5f5f5; cursor:not-allowed; text-transform:capitalize;">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Update Profile
                    </button>
                </form>
            </div>
        </div>

        <!-- CHANGE PASSWORD -->
        <div class="table-container">
            <h3>🔒 Change Password</h3>
            <div style="padding:25px;">
                <div id="pass-message" class="message" style="display:none"></div>
                <form id="password-form">
                    <div class="form-group">
                        <label>Current Password *</label>
                        <input type="password" id="currentPassword"
                            placeholder="Your current password" required>
                    </div>
                    <div class="form-group">
                        <label>New Password *</label>
                        <input type="password" id="newPassword"
                            placeholder="Min 6 characters" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password *</label>
                        <input type="password" id="confirmPassword"
                            placeholder="Repeat new password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Change Password
                    </button>
                </form>
            </div>
        </div>

    </div>

    <footer class="footer">
        <p>🐾 Animal Rescue & Adoption Portal</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        async function loadProfile() {
            const res = await fetch('/api/auth/me');
            const data = await res.json();

            if (!data.loggedIn) {
                window.location.href = '/login.html';
                return;
            }

            // Load full profile
            const profileRes = await fetch('/api/auth/profile');
            const user = await profileRes.json();

            document.getElementById('name').value = user.name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('address').value = user.address || '';
            document.getElementById('role').value = user.role || '';
        }

        // Update profile
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('profile-message');

            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };

            try {
                const res = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ Profile updated successfully!';
                    msgDiv.style.display = 'block';
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = '❌ ' + result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Something went wrong.';
                msgDiv.style.display = 'block';
            }
        });

        // Change password
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('pass-message');

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Passwords do not match';
                msgDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/auth/profile/password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentPassword: document.getElementById('currentPassword').value,
                        newPassword
                    })
                });
                const result = await res.json();

                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ Password changed successfully!';
                    msgDiv.style.display = 'block';
                    document.getElementById('password-form').reset();
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = '❌ ' + result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Something went wrong.';
                msgDiv.style.display = 'block';
            }
        });

        loadProfile();
    </script>
</body>
</html>
