<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | Animal Rescue</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar">
    <div class="nav-brand"><a href="/">🐾 Animal Rescue</a></div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/animals">Browse Animals</a>
        <a href="/report">Report Stray</a>
        <span id="volunteer-link"></span>
        <span id="dashboard-link"></span>
        <a href="/login" id="nav-login">Login</a>
        <span id="nav-user"></span>
        <a href="#" id="nav-logout" style="display:none" onclick="logout()">Logout</a>
    </div>
</nav>

    <div class="page-header">
        <h1>❤️ Adoption / Foster Application</h1>
        <p>Give an animal a loving home — no login required</p>
    </div>

    <div class="auth-container">
        <div class="auth-card" style="max-width:600px;">

            <div id="animal-info"
                style="background:#f0faf5; padding:15px; border-radius:8px; margin-bottom:25px;">
                <h3 id="animal-name">Loading...</h3>
                <p style="color:#777;">Please fill out the form carefully.</p>
            </div>

            <div id="message" class="message" style="display:none"></div>

            <form id="apply-form">
                <input type="hidden" id="animalId">
                <input type="hidden" id="animalNameHidden">

                <h3 style="color:#2c7a4b; margin-bottom:15px;">
                    👤 Your Information
                </h3>

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="applicantName"
                        placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="applicantEmail"
                        placeholder="your@email.com (optional)">
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="text" id="applicantPhone"
                        placeholder="Your phone number" required>
                </div>
                <div class="form-group">
                    <label>Address *</label>
                    <input type="text" id="applicantAddress"
                        placeholder="Your full address" required>
                </div>

                <h3 style="color:#2c7a4b; margin-bottom:15px; margin-top:25px;">
                    📋 Application Details
                </h3>

                <div class="form-group">
                    <label>Application Type</label>
                    <select id="type" required>
                        <option value="adoption">Adoption</option>
                        <option value="foster">Foster</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Why do you want to adopt/foster this animal? *</label>
                    <textarea id="reason" rows="4"
                        placeholder="Tell us your motivation..."
                        required style="resize:vertical;"></textarea>
                </div>
                <div class="form-group">
                    <label>Previous pet experience</label>
                    <textarea id="experience" rows="3"
                        placeholder="Have you owned pets before?"
                        style="resize:vertical;"></textarea>
                </div>
                <div class="form-group">
                    <label>Home Type</label>
                    <select id="homeType">
                        <option value="house">House</option>
                        <option value="apartment">Apartment</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Do you have other pets?</label>
                    <select id="hasOtherPets">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>🐾 Animal Rescue & Adoption Portal</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const animalId = params.get('animalId');
        const animalName = params.get('name');

        if (animalId) {
            document.getElementById('animalId').value = animalId;
            document.getElementById('animalNameHidden').value = animalName;
            document.getElementById('animal-name').textContent = '🐾 Applying for: ' + animalName;
        } else {
            window.location.href = '/animals';
        }

        document.getElementById('apply-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');

            const data = {
                animalId: document.getElementById('animalId').value,
                animalName: document.getElementById('animalNameHidden').value,
                applicantName: document.getElementById('applicantName').value,
                applicantEmail: document.getElementById('applicantEmail').value,
                applicantPhone: document.getElementById('applicantPhone').value,
                applicantAddress: document.getElementById('applicantAddress').value,
                type: document.getElementById('type').value,
                reason: document.getElementById('reason').value,
                experience: document.getElementById('experience').value,
                homeType: document.getElementById('homeType').value,
                hasOtherPets: document.getElementById('hasOtherPets').value
            };

            try {
                const res = await fetch('/api/applications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ Application submitted! We will review it shortly.';
                    msgDiv.style.display = 'block';
                    document.getElementById('apply-form').style.display = 'none';
                    window.scrollTo(0, 0);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = '❌ ' + result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Something went wrong.';
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
