<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Animal Rescue</title>
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261008-2">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand"><a href="/index.html">🐾 Animal Rescue</a></div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/index.html#available-animals">Browse Animals</a>
            <a href="/report.html">Report Stray</a>
            <a href="/volunteer-apply.html">Become a Volunteer</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Volunteer / Admin Login</h2>
            <p class="auth-subtitle">Login to access your dashboard</p>

            <div id="message" class="message" style="display:none"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Your password" required>
                </div>

                <!-- Admin secret code (hidden by default) -->
                <div class="form-group" id="admin-code-group" style="display:none;">
                    <label>Admin Secret Code</label>
                    <input type="password" id="adminCode" placeholder="Enter admin secret code">
                    <small style="color:#777;">Only required for admin login</small>
                </div>

                <div style="margin-bottom:20px;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                        <input type="checkbox" id="is-admin" onchange="toggleAdminCode()">
                        <span style="font-size:14px; color:#555;">I am an admin</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <p class="auth-link">
                Want to volunteer?
                <a href="/volunteer-apply.html">Apply here</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        <p>🐾 Animal Rescue & Adoption Portal</p>
    </footer>

    <script>
        function toggleAdminCode() {
            const isAdmin = document.getElementById('is-admin').checked;
            document.getElementById('admin-code-group').style.display =
                isAdmin ? 'block' : 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                adminCode: document.getElementById('adminCode').value
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ Login successful! Redirecting...';
                    msgDiv.style.display = 'block';

                    // ⚡ Vercel এবং ফাইল আর্কিটেকচার অনুযায়ী এক্সপ্লিসিট রিডাইরেকশন পাথ ফিক্স
                    setTimeout(() => {
                        if (result.user && result.user.role === 'admin') {
                            window.location.href = '/admin-dashboard.html';
                        } else if (result.user && result.user.role === 'volunteer') {
                            window.location.href = '/volunteer-dashboard.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }, 1500);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = '❌ ' + result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Something went wrong.';
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
