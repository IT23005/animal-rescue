<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Animals | Animal Rescue</title>
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261008-nav">
</head>

<body>

    <nav class="navbar">
        <div class="nav-brand"><a href="/index.html">🐾 Animal Rescue</a></div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links" id="nav-links">
            <a href="/index.html" class="nav-item">Home</a>
            <a href="/animals.html" class="nav-item">Browse Animals</a>
            <a href="/report.html" class="nav-item">Report Stray</a>
            <span id="volunteer-link" class="nav-dynamic"></span>
            <span id="dashboard-link" class="nav-dynamic"></span>
            <a href="/login.html" id="nav-login" class="nav-item">Login</a>
            <span id="nav-user" class="nav-dynamic"></span>
            <a href="#" id="nav-logout" class="nav-item nav-logout-btn" style="display:none" onclick="logout(event)">Logout</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>🐾 Available Animals</h1>
        <p>Find your perfect companion</p>
    </div>

    <!-- FILTERS -->
    <div class="filters">
        <input type="text" id="search" placeholder="🔍 Search by name...">
        <select id="filter-species">
            <option value="">All Species</option>
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="bird">Bird</option>
            <option value="other">Other</option>
        </select>
        <select id="filter-health">
            <option value="">All Health Status</option>
            <option value="healthy">Healthy</option>
            <option value="needs treatment">Needs Treatment</option>
            <option value="critical">Critical</option>
        </select>
        <button class="btn btn-primary" onclick="loadAnimals()">Search</button>
        <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
    </div>

    <!-- ANIMALS GRID -->
    <div id="animals-container" class="cards-grid">
        <p style="text-align:center; padding:40px;">Loading animals...</p>
    </div>

    <!-- ANIMAL DETAIL MODAL -->
    <div id="modal" class="modal" style="display:none">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img id="modal-img" src="" alt="Animal"
                style="width:100%; height:250px; object-fit:cover; border-radius:8px;">
            <h2 id="modal-name"></h2>
            <div id="modal-details"></div>
            <div id="modal-actions" style="margin-top:20px;"></div>
        </div>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModal()"></div>

    <footer class="footer">
        <p>🐾 Animal Rescue & Adoption Portal</p>
    </footer>

    <script src="/js/main.js?v=20261008-nav"></script>
    <script>
        let currentUser = null;

        async function init() {
            const res = await fetch('/api/auth/me');
            const data = await res.json();
            if (data.loggedIn) currentUser = data.user;
            loadAnimals();
        }

        async function loadAnimals() {
            const search = document.getElementById('search').value;
            const species = document.getElementById('filter-species').value;
            const health = document.getElementById('filter-health').value;

            let url = `/api/animals?`;
            if (search) url += `search=${search}&`;
            if (species) url += `species=${species}&`;
            if (health) url += `healthStatus=${health}&`;

            const res = await fetch(url);
            const animals = await res.json();
            renderAnimals(animals);
        }

        function renderAnimals(animals) {
            const container = document.getElementById('animals-container');
            if (!container) return;

            if (animals.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:40px; grid-column:1/-1;">No animals found.</p>';
                return;
            }

            container.innerHTML = animals.map(a => {
                // ⚡ ডাটাবেজ স্ক্রিনশট অনুযায়ী হুবহু ফিল্ড ম্যাপিং (a.image এবং a.status)
                const petImage = a.image || '/images/default-animal.png';
                const petStatus = a.status || 'available';

                // সেফটি স্ট্রিং ফরম্যাটিং
                const displaySpecies = a.species ? (a.species.charAt(0).toUpperCase() + a.species.slice(1)) : 'Unknown';
                const displayStatus = petStatus.charAt(0).toUpperCase() + petStatus.slice(1);
                const lowerStatus = petStatus.toLowerCase();

                return `
            <div class="card" onclick="openModal('${a._id}')">
                <img src="${petImage}" 
                     alt="${a.name || 'Animal'}"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200?text=No+Image'">
                <div class="card-body">
                    <h3>${a.name || 'Unnamed'}</h3>
                    <p>🐾 ${displaySpecies} | ${a.gender || 'Unknown'}</p>
                    <p>📅 Age: ${a.age || 'N/A'}</p>
                    <p>❤️ Health: ${a.healthStatus || 'Healthy'}</p>
                    <span class="badge badge-${lowerStatus}">
                        ${displayStatus}
                    </span>
                </div>
            </div>
        `;
            }).join('');
        }


        async function openModal(id) {
            const res = await fetch(`/api/animals/${id}`);
            const a = await res.json();

            // ⚡ ডাটাবেজ স্ক্রিনশট অনুযায়ী হুবহু image ফিল্ড ম্যাপিং
            const petImage = a.image || '/images/default-animal.png';
            const petStatus = a.status || 'available';
            const lowerStatus = petStatus.toLowerCase();

            document.getElementById('modal-img').src = petImage;
            document.getElementById('modal-name').textContent = a.name || 'Unnamed';

            let pendingNote = '';
            try {
                const appRes = await fetch(`/api/applications/check/${a._id}`);
                const appData = await appRes.json();
                if (appData.hasPending) {
                    pendingNote = `<div style="background:#fff3cd; color:#856404; padding:10px; border-radius:8px; margin:10px 0; font-weight:600;">
                ⏳ Requested for Adopt/Foster — Under Review
            </div>`;
                }
            } catch (err) {
                console.log('Could not check application status');
            }

            const displaySpecies = a.species ? (a.species.charAt(0).toUpperCase() + a.species.slice(1)) : 'Unknown';
            const displayStatus = petStatus.charAt(0).toUpperCase() + petStatus.slice(1);

            document.getElementById('modal-details').innerHTML = `
        ${pendingNote}
        <p><strong>Species:</strong> ${displaySpecies}</p>
        <p><strong>Age:</strong> ${a.age || 'N/A'}</p>
        <p><strong>Gender:</strong> ${a.gender || 'Unknown'}</p>
        <p><strong>Health:</strong> ${a.healthStatus || 'Healthy'}</p>
        <p><strong>Status:</strong> ${displayStatus}</p>
        <p><strong>Description:</strong> ${a.description || 'No description available.'}</p>
    `;

            const actionsDiv = document.getElementById('modal-actions');
            if (lowerStatus === 'available') {
                actionsDiv.innerHTML = `
                <a href="/apply.html?animalId=${a._id}&name=${encodeURIComponent(a.name || '')}" class="btn btn-primary">Apply to Adopt/Foster</a>
            `;
            } else if (lowerStatus === 'adopted') {
                actionsDiv.innerHTML = `<p style="color:#777; font-weight:600;">✅ This animal has been adopted.</p>`;
            } else {
                actionsDiv.innerHTML = `<p style="color:#777; font-weight:600;">This animal is not available.</p>`;
            }

            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-overlay').style.display = 'block';
        }


        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('filter-species').value = '';
            document.getElementById('filter-health').value = '';
            loadAnimals();
        }

        init();
    </script>
</body>

</html>
