<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Animal Rescue</title>
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261008-3">
</head>
<body>

   <nav class="navbar">
    <div class="nav-brand"><a href="/index.html">🐾 Animal Rescue</a></div>
    <div class="nav-links">
        <a href="/login.html">Login</a>
        <a href="/register.html">Register</a>
    </div>
</nav>


    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join our community and help save animals</p>

            <div id="message" class="message" style="display:none"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" required>
                </div>
                <div class="form-group">
                    <label>Phone </label>
                    <input type="text" id="phone" placeholder="Your phone number" required>
                </div>
                <div class="form-group">
                    <label>Address </label>
                    <input type="text" id="address" placeholder="Your address" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-link">Already have an account? <a href="/login.html">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };

            const msgDiv = document.getElementById('message');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ Registration successful! Redirecting...';
                    msgDiv.style.display = 'block';
                    setTimeout(() => window.location.href = '/index.html', 1500);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = '❌ ' + result.message;
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '❌ Something went wrong. Try again.';
                msgDiv.style.display = 'block';
            }
        });
    </script>
<script src="/js/main.js?v=20261008-2"></script>
</body>
</html>
